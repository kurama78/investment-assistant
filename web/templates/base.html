<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Investment Assistant" }}</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --card: #fffaf1;
      --line: #d8cdb8;
      --text: #2f2419;
      --muted: #6b5a46;
      --accent: #1f6f5f;
      --accent-2: #d5853f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Noto Serif SC", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(213,133,63,.16), transparent 28%),
        radial-gradient(circle at top right, rgba(31,111,95,.12), transparent 24%),
        var(--bg);
    }
    header, main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    header { display: flex; gap: 16px; justify-content: space-between; align-items: center; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    nav a {
      color: var(--text);
      text-decoration: none;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.5);
    }
    .hero, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 16px 50px rgba(47,36,25,.06);
    }
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .muted { color: var(--muted); }
    h1, h2, h3 { margin-top: 0; }
    code, pre { font-family: Consolas, monospace; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(31,111,95,.12);
      color: var(--accent);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="muted">Investment Assistant</div>
      <strong>Gemini Web Console</strong>
    </div>
    <nav>
      <a href="/">首页</a>
      <a href="/portfolio">组合</a>
      <a href="/stocks">股票</a>
      <a href="/add-stock">新增股票</a>
      <a href="/research-history">研究历史</a>
      <a href="/preferences">偏好</a>
      <a href="/batch-scan">批量扫描</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
