<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 投资研究助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(59,130,246,0.30),_transparent_35%),linear-gradient(135deg,_#020617,_#0f172a_45%,_#172554)]"></div>
    <main class="relative min-h-screen flex items-center justify-center px-4 py-10">
        <section class="w-full max-w-md rounded-3xl border border-white/10 bg-white/95 text-slate-900 shadow-2xl shadow-black/30 backdrop-blur">
            <div class="p-8">
                <div class="mb-8 text-center">
                    <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 text-2xl text-white">📊</div>
                    <h1 class="text-2xl font-bold">登录投资研究助手</h1>
                    <p class="mt-2 text-sm text-slate-500">登录后才能访问组合、研究记录和 Gemini 研究能力。</p>
                </div>

                {% if error %}
                <div class="mb-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" action="/login" class="space-y-4">
                    <input type="hidden" name="next" value="{{ next_url }}">
                    <div>
                        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">管理员密码</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
                            placeholder="输入登录密码"
                        >
                    </div>
                    <button
                        type="submit"
                        class="w-full rounded-xl bg-blue-600 px-4 py-3 font-medium text-white transition hover:bg-blue-700"
                    >
                        登录
                    </button>
                </form>

                <p class="mt-5 text-center text-xs text-slate-500">
                    密码可以通过环境变量 <code class="rounded bg-slate-100 px-1 py-0.5">AUTH_PASSWORD</code> 或配置接口设置。
                </p>
            </div>
        </section>
    </main>
</body>
</html>
