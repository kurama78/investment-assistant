name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d7q17rf7f7vs73cgi7k0
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "GitHub secret RENDER_API_KEY is not configured yet; skipping Render deploy trigger."
            exit 0
          fi

          payload=$(printf '{"commitId":"%s","clearCache":"do_not_clear"}' "$GITHUB_SHA")
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$payload")

          echo "Render deploy triggered."
          echo "$response"
